<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WA Sender Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0a0c0f;
  --surface: #111318;
  --surface2: #181b22;
  --border: #1e2229;
  --green: #00e676;
  --green-dim: #00e67622;
  --red: #ff4757;
  --yellow: #ffd32a;
  --blue: #3d9cf5;
  --text: #e8eaf0;
  --muted: #5a6070;
  --radius: 12px;
  --sidebar: 240px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
h1,h2,h3,h4 { font-family: 'Syne', sans-serif; }

/* ── AUTH ──────────────────────────────────────── */
#auth-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  background: radial-gradient(ellipse at 20% 50%, #00e67608 0%, transparent 60%),
              radial-gradient(ellipse at 80% 20%, #3d9cf508 0%, transparent 60%);
}
.auth-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 48px 40px; width: 380px;
  box-shadow: 0 40px 80px #00000060;
}
.auth-logo { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800;
  color: var(--green); margin-bottom: 8px; }
.auth-sub { color: var(--muted); margin-bottom: 36px; font-size: 14px; }

/* ── LAYOUT ────────────────────────────────────── */
#app { display: none; }
.layout { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--sidebar); background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh;
  z-index: 100;
}
.sidebar-logo {
  padding: 24px 20px 20px; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px;
  color: var(--green); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.sidebar-logo span { color: var(--text); }
.nav { flex: 1; padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px;
  border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 14px;
  transition: all .2s; text-decoration: none;
}
.nav-item:hover { color: var(--text); background: var(--surface2); }
.nav-item.active { color: var(--green); background: var(--green-dim); }
.nav-item i { width: 18px; text-align: center; }
.nav-badge {
  margin-left: auto; background: var(--red); color: #fff;
  font-size: 10px; padding: 2px 6px; border-radius: 20px; font-weight: 600;
}
.sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
.user-pill { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--green-dim);
  border: 2px solid var(--green); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px; color: var(--green);
}

.main { margin-left: var(--sidebar); flex: 1; padding: 28px 32px; }
.page { display: none; }
.page.active { display: block; }

/* ── COMMON COMPONENTS ─────────────────────────── */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.page-title { font-size: 24px; font-weight: 700; }
.page-title small { display: block; color: var(--muted); font-size: 13px; font-family: 'DM Sans'; font-weight: 400; margin-top: 2px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px;
  border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500;
  font-family: 'DM Sans'; transition: all .2s;
}
.btn-primary { background: var(--green); color: #000; }
.btn-primary:hover { background: #00ff8a; }
.btn-danger  { background: var(--red); color: #fff; }
.btn-ghost   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--muted); }
.btn-sm { padding: 6px 12px; font-size: 12px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }

.form-group { margin-bottom: 16px; }
.label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
.input, .select, .textarea {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 14px;
  font-family: 'DM Sans'; transition: border-color .2s; outline: none;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--green); }
.textarea { resize: vertical; min-height: 100px; }
.select option { background: var(--surface2); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 14px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--surface2); }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
.badge-green  { background: #00e67622; color: var(--green); }
.badge-red    { background: #ff475722; color: var(--red); }
.badge-yellow { background: #ffd32a22; color: var(--yellow); }
.badge-blue   { background: #3d9cf522; color: var(--blue); }
.badge-gray   { background: #ffffff0f; color: var(--muted); }

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-green  { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot-red    { background: var(--red); }
.dot-yellow { background: var(--yellow); }
.dot-gray   { background: var(--muted); }

/* ── MODAL ─────────────────────────────────────── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: #00000088; z-index: 1000;
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  width: 520px; max-width: 95vw; max-height: 90vh; overflow-y: auto;
  padding: 28px; position: relative;
}
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
.modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
.modal-close:hover { color: var(--text); }

/* ── DASHBOARD ─────────────────────────────────── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; position: relative; overflow: hidden;
}
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.stat-card.green::before { background: var(--green); }
.stat-card.blue::before  { background: var(--blue); }
.stat-card.yellow::before{ background: var(--yellow); }
.stat-card.red::before   { background: var(--red); }
.stat-icon { font-size: 28px; margin-bottom: 12px; }
.stat-value { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; }
.stat-label { color: var(--muted); font-size: 12px; margin-top: 4px; }

.charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
@media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }

/* ── INBOX ─────────────────────────────────────── */
.inbox-layout { display: grid; grid-template-columns: 320px 1fr; gap: 0; height: calc(100vh - 120px); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.conv-list { border-right: 1px solid var(--border); overflow-y: auto; }
.conv-search { padding: 14px; border-bottom: 1px solid var(--border); }
.conv-item { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; }
.conv-item:hover { background: var(--surface2); }
.conv-item.active { background: var(--green-dim); border-left: 3px solid var(--green); }
.conv-name { font-weight: 600; font-size: 14px; }
.conv-preview { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.conv-time { font-size: 11px; color: var(--muted); }
.unread-badge { background: var(--green); color: #000; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 700; }

.chat-area { display: flex; flex-direction: column; }
.chat-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.msg-bubble { max-width: 65%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
.msg-bubble.inbound { background: var(--surface2); border-radius: 2px 12px 12px 12px; align-self: flex-start; }
.msg-bubble.outbound { background: #00e67618; border: 1px solid #00e67630; border-radius: 12px 2px 12px 12px; align-self: flex-end; }
.msg-time { font-size: 10px; color: var(--muted); margin-top: 4px; }
.chat-input-area { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
.chat-input-area .input { flex: 1; }
.chat-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); gap: 12px; }

/* ── PROGRESS BAR ──────────────────────────────── */
.progress-bar { background: var(--border); border-radius: 4px; height: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--green); border-radius: 4px; transition: width .5s; }

/* ── DROPZONE ──────────────────────────────────── */
.dropzone {
  border: 2px dashed var(--border); border-radius: var(--radius); padding: 40px;
  text-align: center; cursor: pointer; transition: all .2s; color: var(--muted);
}
.dropzone:hover, .dropzone.over { border-color: var(--green); color: var(--text); background: var(--green-dim); }
.dropzone i { font-size: 32px; margin-bottom: 12px; }

/* ── QR CODE ──────────────────────────────────── */
.qr-container { text-align: center; padding: 20px; }
.qr-container img { width: 200px; height: 200px; border: 4px solid var(--green); border-radius: 12px; }

/* ── TOAST ─────────────────────────────────────── */
#toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 18px; font-size: 13px; min-width: 260px; max-width: 360px;
  box-shadow: 0 10px 40px #00000060; display: flex; align-items: center; gap: 10px;
  animation: slideIn .3s ease;
}
.toast.success { border-left: 4px solid var(--green); }
.toast.error   { border-left: 4px solid var(--red); }
.toast.info    { border-left: 4px solid var(--blue); }
@keyframes slideIn { from { opacity:0; transform: translateX(40px); } to { opacity:1; transform: translateX(0); } }

/* ── TABS ──────────────────────────────────────── */
.tabs { display: flex; gap: 4px; background: var(--surface2); border-radius: 8px; padding: 4px; margin-bottom: 20px; width: fit-content; }
.tab { padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--muted); transition: all .2s; }
.tab.active { background: var(--surface); color: var(--text); box-shadow: 0 2px 8px #00000040; }

/* ── MULTI SELECT ──────────────────────────────── */
.multi-select-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.check-card {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all .2s;
}
.check-card:hover { border-color: var(--muted); }
.check-card.selected { border-color: var(--green); background: var(--green-dim); color: var(--green); }
.check-card input { accent-color: var(--green); }

/* ── SCROLLBAR ─────────────────────────────────── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">⚡ WA Sender</div>
    <div class="auth-sub">Plataforma de envíos masivos WhatsApp</div>
    <div class="form-group">
      <label class="label">Correo electrónico</label>
      <input class="input" id="login-email" type="email" placeholder="admin@empresa.com">
    </div>
    <div class="form-group">
      <label class="label">Contraseña</label>
      <input class="input" id="login-password" type="password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="login()">
      <i class="fas fa-sign-in-alt"></i> Iniciar sesión
    </button>
    <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--muted)">
      ¿Primera vez? <a href="#" onclick="showRegister()" style="color:var(--green)">Crear cuenta</a>
    </p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo"><i class="fab fa-whatsapp"></i> WA<span>Sender</span></div>
      <nav class="nav">
        <a class="nav-item active" onclick="navigate('dashboard')"><i class="fas fa-chart-line"></i> Dashboard</a>
        <a class="nav-item" onclick="navigate('campaigns')"><i class="fas fa-paper-plane"></i> Campañas</a>
        <a class="nav-item" onclick="navigate('contacts')"><i class="fas fa-users"></i> Contactos</a>
        <a class="nav-item" onclick="navigate('templates')"><i class="fas fa-file-alt"></i> Plantillas</a>
        <a class="nav-item" onclick="navigate('lines')"><i class="fas fa-mobile-alt"></i> Líneas</a>
        <a class="nav-item" onclick="navigate('inbox')">
          <i class="fas fa-comments"></i> Inbox
          <span class="nav-badge" id="inbox-badge" style="display:none">0</span>
        </a>
        <a class="nav-item" onclick="navigate('reports')"><i class="fas fa-chart-bar"></i> Reportes</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="avatar" id="user-avatar">?</div>
          <div>
            <div style="font-size:13px;font-weight:600" id="user-name">–</div>
            <div style="font-size:11px;color:var(--muted)" id="user-role">–</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="logout()" style="margin-left:auto;padding:6px 8px">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div id="page-dashboard" class="page active"></div>
      <div id="page-campaigns" class="page"></div>
      <div id="page-contacts"  class="page"></div>
      <div id="page-templates" class="page"></div>
      <div id="page-lines"     class="page"></div>
      <div id="page-inbox"     class="page"></div>
      <div id="page-reports"   class="page"></div>
    </main>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- MODALS -->
<div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
